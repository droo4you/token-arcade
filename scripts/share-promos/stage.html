function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInCubic(t) { return t * t * t; }
function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function rnd(i) {
  const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);

}
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(`image failed ${src}`));
    img.src = src;

}

function chromaKey(img) {
  const w = img.width, h = img.height;
  const src = document.createElement("canvas");
  src.width = w; src.height = h;
  const sctx = src.getContext("2d", { willReadFrequently: true });

  const image = sctx.getImageData(0, 0, w, h);
  const d = image.data;
  const seen = new Uint8Array(w * h);
  const qx = new Int32Array(w * h);
  const qy = new Int32Array(w * h);
  let qe = 0;
  const tol2 = 72 * 72;
  const seed = (x, y) => {
    const i = y * w + x;
    if (seen[i]) return;
    seen[i] = 1;
    qx[qe] = x; qy[qe] = y; qe++;
  };
  for (let x = 0; x < w; x++) { seed(x, 0); seed(x, h - 1); }
  for (let y = 1; y < h - 1; y++) { seed(0, y); seed(w - 1, y); }
  const nbs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (let qs = 0; qs < qe; qs++) {
    const x = qx[qs], y = qy[qs];
    const p = (y * w + x) * 4;
    const r = d[p], g = d[p + 1], b = d[p + 2];
    d[p + 3] = 0;
    for (let k = 0; k < 4; k++) {
      const nx = x + nbs[k][0], ny = y + nbs[k][1];
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const ni = ny * w + nx;
      if (seen[ni]) continue;
      const np = ni * 4;
      const dr = d[np] - r, dg = d[np + 1] - g, db = d[np + 2] - b;
      if (dr * dr + dg * dg + db * db <= tol2) {
        seen[ni] = 1;
        qx[qe] = nx; qy[qe] = ny; qe++;
      }
    }
  }
  for (let pass = 0; pass < 2; pass++) {
    const kill = [];

      for (let x = 1; x < w - 1; x++) {
        const p = (y * w + x) * 4;
        if (d[p + 3] === 0) continue;
        let br = 0, bg = 0, bb = 0, bn = 0;
        for (let k = 0; k < 4; k++) {
          const np = ((y + nbs[k][1]) * w + (x + nbs[k][0])) * 4;
          if (d[np + 3] === 0) { br += d[np]; bg += d[np + 1]; bb += d[np + 2]; bn++; }
        }
        if (!bn) continue;
        const dr = d[p] - br / bn, dg = d[p + 1] - bg / bn, db = d[p + 2] - bb / bn;
        if (dr * dr + dg * dg + db * db < 52 * 52) kill.push(p);

    for (const p of kill) d[p + 3] = 0;
  }
  sctx.putImageData(image, 0, 0);

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (d[(y * w + x) * 4 + 3] > 20) {
        opaque++;
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      }
    }
  }
  const ratio = opaque / (w * h);
  if (ratio < 0.04 || ratio > 0.92 || maxX <= minX + 8) return { ok: false, ratio };
  const bw = maxX - minX + 1, bh = maxY - minY + 1, pad = 10;
  const out = document.createElement("canvas");
  out.width = bw + pad * 2; out.height = bh + pad * 2;
  const octx = out.getContext("2d");
  for (let dy = -4; dy <= 4; dy += 2) {
    for (let dx = -4; dx <= 4; dx += 2) {
      if (dx * dx + dy * dy > 20) continue;
      octx.drawImage(src, minX, minY, bw, bh, pad + dx, pad + dy, bw, bh);
    }
  }
  octx.globalCompositeOperation = "source-in";
  octx.fillStyle = "#241028";
  octx.fillRect(0, 0, out.width, out.height);
  octx.globalCompositeOperation = "source-over";
  octx.drawImage(src, minX, minY, bw, bh, pad, pad, bw, bh);
  return { ok: true, ratio, canvas: out };
}

function makeBmp(rows, pal, scale) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement("canvas");
  c.width = w * scale; c.height = h * scale;
  const b = c.getContext("2d");
  b.imageSmoothingEnabled = false;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (!pal[ch]) continue;
      b.fillStyle = pal[ch];
      b.fillRect(x * scale, y * scale, scale, scale);
    }
  }
  return c;
}

  if (n === 0) return { o: "#2a2236", b: "#9a96a6", c: "#d8d4e2", d: "#6e6a7c" };
  const hue = (n * 47) % 360, sat = 18 + (n * 13) % 40;

function drawStar(x, y, r, color, alpha, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    ctx.lineTo(0, -r);
    ctx.lineTo(r * 0.32, -r * 0.32);
    ctx.rotate(Math.PI / 2);
  }
  ctx.fill();
  ctx.restore();
}
function sparkles(t, count, color, y0, y1, seed) {
  for (let i = 0; i < count; i++) {
    const speed = 0.45 + rnd(seed + i) * 0.9;
    const phase = (t * speed + rnd(seed + i + 20)) % 1;
    const x = (rnd(seed + i + 40) * W + Math.sin(t * 6 + i) * 12) % W;
    const y = lerp(y1, y0, phase);
    drawStar(x, y, 4 + rnd(seed + i + 3) * 8, color, Math.sin(phase * Math.PI) * 0.9, t * 3 + i);
  }
}
function vignette(strength) {
  const g = ctx.createRadialGradient(W / 2, H / 2, 260, W / 2, H / 2, 820);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, `rgba(8,4,16,${strength})`);

function speedLines(t, y, color, alpha) {

  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  for (let i = 0; i < 14; i++) {
    const yy = y + (rnd(i + 8) - 0.5) * 220;
    const len = 40 + rnd(i + 2) * 120;

    ctx.lineTo(x - len, yy);

function titleBlock(t, text, tag, opts = {}) {
  const y = opts.y ?? 628;
  const fill = opts.fill ?? "#fff7ed";
  const ink = opts.ink ?? "#1a0e20";
  const start = opts.start ?? 0.56;
  let size = opts.size ?? 92;
  const u = clamp((t - start) / 0.15, 0, 1);
  if (u <= 0) return;
  const fade = t > 0.935 ? 1 - clamp((t - 0.935) / 0.065, 0, 1) : 1;
  const e = easeOutBack(u);
  const scale = lerp(1.62, 1, e);
  const alpha = Math.min(1, u * 1.7) * fade;
  ctx.save();
  ctx.translate(W / 2, y);
  ctx.scale(scale, Math.min(scale, lerp(0.72, 1, e)));
  ctx.globalAlpha = alpha;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const face = opts.font || "Space Grotesk";
  ctx.font = `700 ${size}px "${face}"`;
  while (ctx.measureText(text).width > 1120 && size > 46) {
    size -= 4;
    ctx.font = `700 ${size}px "${face}"`;
  }
  ctx.lineJoin = "round";
  ctx.miterLimit = 2;
  ctx.lineWidth = Math.max(10, size * 0.13);
  ctx.strokeStyle = ink;
  ctx.strokeText(text, 8, 9);
  ctx.fillStyle = ink;
  ctx.fillText(text, 8, 9);
  ctx.lineWidth = Math.max(8, size * 0.1);
  ctx.strokeText(text, 0, 0);
  ctx.fillStyle = fill;
  ctx.fillText(text, 0, 0);
  if (tag) {
    ctx.font = `800 24px "DM Sans"`;
    const tw = Math.min(980, ctx.measureText(tag).width + 40);
    roundRect(-tw / 2, size * 0.52, tw, 42, 21);
    ctx.fillStyle = ink;
    ctx.fill();
    ctx.fillStyle = "#fff7ed";
    ctx.fillText(tag, 0, size * 0.52 + 22);
  }
  ctx.restore();
}

function cutLabel(text, local) {
  const inn = clamp(local / 0.16, 0, 1);
  const out = local > 0.74 ? clamp((local - 0.74) / 0.2, 0, 1) : 0;
  const a = easeOutCubic(inn) * (1 - out);
  if (a <= 0.01) return;
  const e = easeOutBack(inn);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(78, 78);
  ctx.scale(lerp(1.4, 1, e), lerp(0.7, 1, e));
  ctx.font = `700 34px "Space Grotesk"`;
  const tw = ctx.measureText(text).width + 36;
  roundRect(0, -28, tw, 52, 16);
  ctx.fillStyle = "#1a0e20";
  ctx.fill();
  ctx.fillStyle = "#fff7ed";
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.fillText(text, 18, 0);
  ctx.restore();
}

function blitFeet(sheet, name, x, y, scale, flip, sx, sy) {
  const rect = RECTS[name];
  if (!sheet || !rect) return;
  const [rx, ry, rw, rh] = rect;
  const dw = rw * scale, dh = rh * scale;
  ctx.save();

  ctx.translate(x, y);
  ctx.scale((flip ? -1 : 1) * (sx || 1), sy || 1);
  ctx.drawImage(sheet, rx, ry, rw, rh, -dw / 2, -dh, dw, dh);
  ctx.restore();
}

  ctx.ellipse(x, y, w, 12, 0, 0, Math.PI * 2);

function buddyAt(sprite, x, ground, height, sx, sy, rot) {
  const aspect = sprite.canvas.width / sprite.canvas.height;
  const dh = height, dw = height * aspect;
  ctx.save();
  ctx.translate(x, ground + 8);
  ctx.fillStyle = "rgba(18, 48, 22, 0.28)";
  ctx.beginPath();
  ctx.ellipse(0, 0, dw * 0.28 * sx, 16, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(x, ground);
  ctx.rotate(rot || 0);
  ctx.scale(sx, sy);
  ctx.drawImage(sprite.canvas, -dw / 2, -dh, dw, dh);
  ctx.restore();

function hopPose(t, cycles, phase) {
  const hop = (t * cycles + phase) % 1;
  const air = Math.sin(hop * Math.PI);
  let sx = 1, sy = 1;
  if (hop < 0.12) { sx = lerp(1.22, 1, hop / 0.12); sy = lerp(0.78, 1, hop / 0.12); }
  else if (hop > 0.88) { const u = (hop - 0.88) / 0.12; sx = lerp(1, 1.24, u); sy = lerp(1, 0.76, u); }
  else { sx = lerp(0.94, 1, 1 - air); sy = lerp(1.1, 1, 1 - air); }
  return { hop, air, sx, sy };
}
function springHop(t, cycles, phase) {
  let hop = (t * cycles + phase) % 1;

  let sx = 1, sy = 1, rot = Math.sin(hop * Math.PI * 2) * 0.14;
  if (hop < 0.16) {
    const e = easeOutBack(hop / 0.16);
    sx = lerp(1.46, 0.84, e);
    sy = lerp(0.58, 1.2, e);
  } else if (hop > 0.8) {
    const u = easeOutCubic((hop - 0.8) / 0.2);
    sx = lerp(0.86, 1.5, u);
    sy = lerp(1.22, 0.55, u);
  } else {
    sx = lerp(0.78, 1, 1 - air);
    sy = lerp(1.32, 1, 1 - air);
  }
  return { hop, air, sx, sy, rot };
}

function glyphStrip(color) {

  c.width = keys.length * 6; c.height = 7;

function drawSkrumpey(t, opts = {}) {

  sky.addColorStop(0, "#3c93f5");
  sky.addColorStop(0.55, "#8fd4ff");

  ctx.fillStyle = sky;

  const sunX = 1040 + Math.sin(t * Math.PI * 4) * 10;
  const sun = ctx.createRadialGradient(sunX, 120, 10, sunX, 120, 140);
  sun.addColorStop(0, "rgba(255,244,186,0.95)");

function drawCatCell(x, y, w, h, label, value, color, flip, arrow) {
  const s = Math.cos(clamp(flip, 0, 1) * Math.PI);
  const front = flip >= 0.5;
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  ctx.scale(Math.max(0.05, Math.abs(s)), 1);
  roundRect(-w / 2, -h / 2, w, h, 12);
  if (!front) {
    ctx.fillStyle = "#EDE8DC";
    ctx.fill();
    ctx.setLineDash([6, 5]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#D6CFC2";
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#A39E94";
    ctx.font = `600 15px "DM Sans"`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label.toUpperCase(), 0, 0);
  } else {
    ctx.fillStyle = color;
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `800 ${value.length > 10 ? 16 : 20}px "DM Sans"`;
    ctx.fillText(value, 0, arrow ? -12 : 0);
    if (arrow) {
      ctx.beginPath();
      if (arrow === "up") { ctx.moveTo(0, 4); ctx.lineTo(-9, 18); ctx.lineTo(9, 18); }
      else { ctx.moveTo(0, 22); ctx.lineTo(-9, 8); ctx.lineTo(9, 8); }
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawUppers(t, opts = {}) {
  const titles = opts.titles !== false;
  ctx.fillStyle = "#100b20";
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#281d42";
  ctx.lineWidth = 1;
  const drift = t * 80;
  for (let x = -((drift % 54)); x < W; x += 54) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 54) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  const base = 520;
  const catches = [0.16, 0.34, 0.52, 0.7];
  let y = 180;
  let vy = 220;
  const pts = [];
  const steps = 90;
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const tt = u * Math.max(t, 0.02);
    vy += 900 * (1 / steps);
    for (const c of catches) if (Math.abs(tt - c) < 0.012) vy = -420 - (c > 0.4 ? 180 : 0);
    y += vy * (1 / steps) * 0.42;
    y = Math.max(90, Math.min(base - 8, y));
    pts.push([80 + u * 980, y + Math.sin(i * 0.7) * 3]);
  }
  const head = pts[Math.min(pts.length - 1, Math.floor(t * steps))];
  const btnX = head[0];
  const catching = catches.some((c) => Math.abs(t - c) < 0.04);
  ctx.strokeStyle = "rgba(174,140,255,0.35)";
  ctx.setLineDash([8, 8]);
  ctx.beginPath();
  ctx.moveTo(0, base);
  ctx.lineTo(W, base);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.save();
  ctx.strokeStyle = t > 0.9 ? "#ff3b30" : "#ae8cff";
  ctx.lineWidth = 4;
  ctx.lineJoin = "miter";
  ctx.shadowColor = ctx.strokeStyle;
  ctx.shadowBlur = 12;
  ctx.beginPath();
  pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = "#ae8cff";
  ctx.shadowColor = "#ae8cff";
  ctx.shadowBlur = 16;
  ctx.fillRect(head[0] - 6, head[1] - 6, 12, 12);
  ctx.shadowBlur = 0;
  const chips = [
    [0.22, "LIFT", "#6fe37a"],
    [0.4, "2X", "#ae8cff"],
    [0.58, "SURGE", "#00c805"],
    [0.76, "ORB", "#ffc93c"],
  ];
  chips.forEach(([at, label, col], i) => {
    if (t + 0.08 < at) return;
    const x = 220 + i * 220;
    const cy = 150 + Math.sin(t * 6 + i) * 8;
    drawChip(x, cy, label, col);
  });
  if (catching) {
    ctx.font = `800 22px "DM Sans"`;
    ctx.fillStyle = "#cfd4c4";
    ctx.textAlign = "center";
    ctx.fillText("BOUNCE", head[0], head[1] - 36);
  }
  drawGoButton(btnX, base + 18, 150, catching ? 1 : 0.08);
  ctx.font = `700 13px "DM Sans"`;
  ctx.textAlign = "left";
  ctx.fillStyle = "#a59abd";
  ctx.fillText("SIGNAL", 36, 36);
  ctx.fillText("PEAK", 1080, 36);
  ctx.font = `800 28px "DM Sans"`;
  ctx.fillStyle = "#f2f2ef";
  ctx.fillText("$" + Math.round(lerp(120, 2400, easeOutCubic(t))) + "K", 36, 68);
  ctx.textAlign = "right";
  ctx.fillStyle = "#ae8cff";
  ctx.fillText("$" + Math.round(lerp(180, 3100, easeOutCubic(t))) + "K", 1244, 68);
  roundRect(36, 88, 118, 28, 14);
  ctx.fillStyle = t > 0.76 ? "#ffc93c" : "transparent";
  ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = "#ffc93c";
  ctx.stroke();
  ctx.font = `800 13px "DM Sans"`;
  ctx.textAlign = "center";
  ctx.fillStyle = t > 0.76 ? "#000" : "#ffc93c";
  ctx.fillText("ORBS " + (t > 0.76 ? "1" : "0") + "/10", 95, 102);
  ctx.textAlign = "left";
  ctx.font = `700 13px "DM Sans"`;
  ctx.fillStyle = "#a59abd";
  ctx.fillText("STREAK", 176, 108);
  ctx.font = `800 16px "DM Sans"`;
  ctx.fillStyle = "#f2f2ef";
  ctx.fillText(String(Math.min(4, Math.floor(t * 6))), 236, 108);
  ctx.save();
  ctx.strokeStyle = "rgba(174,140,255,0.45)";
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(head[0], head[1]);
  ctx.lineTo(W - 24, head[1]);
  ctx.stroke();

  if (t < 0.12) {

}

    px(i % 8 ? "#bfe8ff" : "#ffffff", 12 + wob, -4 - i, Math.max(4, 10 - i / 18), 4);
  }
  pixText("BUY", x + 8, y - spout - 14, "#7be08a", 1);
}
function drawSkip(t, opts = {}) {
  const titles = opts.titles !== false;
  const GW = 480, GH = 270, WY = 205;
  const fly = clamp(t / 0.82, 0, 1);
  const eras = [
    { top: "#6fbfee", bot: "#d8f0ff", far: "#9cbde0", near: "#6a96c4", water: "#3f86c6", deep: "#2a5f9c", foam: "#d8f4ff" },
    { top: "#5cc4ff", bot: "#fff6b8", far: "#8acc78", near: "#56a05a", water: "#2f9ab0", deep: "#1f6f84", foam: "#e0fff4" },
    { top: "#33337f", bot: "#ff9a6a", far: "#7a4a8a", near: "#4a2a6a", water: "#2a4a9a", deep: "#1a306a", foam: "#ffd8b8" },
  ];
  const ei = fly * (eras.length - 1);
  const i0 = Math.min(eras.length - 2, Math.floor(ei));
  const blend = ei - i0;
  const col = (k) => lerpColorHex(eras[i0][k], eras[i0 + 1][k], blend);
  inView(GW, GH, () => {
    const sky = ctx.createLinearGradient(0, 0, 0, WY);
    sky.addColorStop(0, col("top"));
    sky.addColorStop(1, col("bot"));
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, GW, GH);
    ctx.fillStyle = col("far");
    ctx.beginPath();
    ctx.moveTo(0, WY);
    for (let x = 0; x <= GW; x += 4) ctx.lineTo(x, WY - 26 - Math.sin((x + t * 30) / 50) * 10);
    ctx.lineTo(GW, WY);
    ctx.fill();
    ctx.fillStyle = col("near");
    ctx.beginPath();
    ctx.moveTo(0, WY);
    for (let x = 0; x <= GW; x += 4) ctx.lineTo(x, WY - 12 - Math.sin((x + t * 50) / 26) * 6);
    ctx.lineTo(GW, WY);
    ctx.fill();
    ctx.fillStyle = col("water");
    ctx.fillRect(0, WY, GW, GH - WY);
    ctx.fillStyle = col("deep");
    for (let y = WY + 8; y < GH; y += 8) ctx.fillRect(0, y, GW, 2);
    ctx.fillStyle = col("foam");
    for (let x = 0; x < GW; x += 4) ctx.fillRect((x + Math.round(t * 40)) % GW, WY + Math.round(Math.sin((x + t * 40) / 9)), 3, 1);
    const dockY = WY - 22;
    ctx.fillStyle = "#6a4422";
    ctx.fillRect(0, dockY, 118, 5);
    ctx.fillStyle = "#8a5a30";
    ctx.fillRect(0, dockY, 118, 1);
    ctx.fillStyle = "#4a2e16";
    for (let x = 10; x < 110; x += 28) ctx.fillRect(x, dockY + 5, 4, WY - dockY + 8);
    ctx.fillStyle = "#5a3a1a";
    ctx.fillRect(18, dockY - 22, 2, 22);
    ctx.fillStyle = "#fdf6e0";
    ctx.fillRect(6, dockY - 34, 44, 13);
    ctx.fillStyle = "#22163a";
    ctx.fillRect(6, dockY - 21, 44, 1);
    pixText("NO SWIM", 9, dockY - 31, "#e5487f", 1);
    const handX = 96, handY = WY - 38;
    if (t < 0.2) {
      ctx.save();
      ctx.globalAlpha = 1 - t / 0.2;
      ctx.translate(handX, handY);
      ctx.fillStyle = "rgba(123,224,138,0.45)";
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, 44, -24 * Math.PI / 180, -8 * Math.PI / 180);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      pixText("SKIP ZONE", 128, handY - 28, "#7be08a", 1);
    }
    if (media.skip) {
      blitFeet(media.skip, t < 0.1 ? "crouch" : "wave", 78, dockY, 1, false, 1, 1);
      blitFeet(media.skip, "rcFront", 54, dockY - 26 + Math.sin(t * 8) * 2, 1, false, 1, 1);
    }
    const hops = 5;
    const hopT = (fly * hops) % 1;
    const hopN = Math.floor(fly * hops);
    const air = Math.sin(Math.min(1, hopT) * Math.PI);
    const rockX = lerp(handX, 440, fly);
    const rockY = WY - 6 - air * lerp(22, 64, fly);
    if (rocks[0]) {
      ctx.save();
      ctx.translate(rockX, rockY);
      ctx.rotate(fly * 10);
      ctx.drawImage(rocks[0], -8, -6, 16, 11);
      ctx.restore();
    }
    if (air > 0.9 && fly > 0.06 && fly < 0.92) {
      pixTextC("PERFECT", rockX, rockY - 18, "#ffe066", 1, "#22163a");
      if (hopN >= 2) pixTextC(hopN + "X STREAK", rockX, rockY - 28, "#ff9f3a", 1, "#22163a");
    }
    const lineY = lerp(78, 40, fly);
    const broke = fly > 0.82;
    ctx.fillStyle = broke ? "#7be08a" : "#ff5a6a";
    for (let x = 0; x < GW; x += 12) ctx.fillRect(x, lineY, 7, 2);
    pixText(broke ? "$10,000 SUPPORT" : "$10,000 RESISTANCE", GW - 148, lineY - 9, broke ? "#7be08a" : "#ff5a6a", 1);
    if (t > 0.55 && t < 0.8) drawPixelWhale(300, WY - 4, 64);
    ctx.fillStyle = "rgba(20,12,40,0.55)";
    ctx.fillRect(0, 0, GW, 22);
    const names = ["JUL 2015", "ICO MANIA", "DEFI SUMMER", "YOU ARE HERE"];
    pixText(names[Math.min(names.length - 1, Math.floor(fly * names.length))], 4, 2, "#ffffff", 1);
    pixText("DAY " + Math.round(lerp(12, 4088, fly)), 4, 12, "#b8a8e8", 1);
    const price = Math.round(lerp(1100, 10000, easeOutCubic(fly)));
    pixTextC("ETH $" + price.toLocaleString("en-US"), GW / 2 - 10, 3, price > 9000 ? "#ffe066" : "#7be08a", 2, "#22163a");
    pixText("GAS 8/12", GW - 62, 4, "#7be08a", 1);
    ctx.fillStyle = "#322443";
    ctx.fillRect(GW - 62, 14, 48, 4);
    ctx.fillStyle = "#7be08a";
    ctx.fillRect(GW - 62, 14, 32, 4);
  });
  if (titles) titleBlock(t, "SKIP TO 10K", "A Droober and RC rock skipping saga.", { fill: "#ffe066", ink: "#22163a", y: 660, size: 72, start: 0.72 });
}

function drawPixelApple(x, y) {
  ctx.fillStyle = "#22163a";
  ctx.fillRect(x + 4, y - 1, 2, 3);
  ctx.fillStyle = "#5fbf4a";
  ctx.fillRect(x + 6, y - 1, 3, 2);
  ctx.fillStyle = "#22163a";
  ctx.fillRect(x + 6, y - 2, 3, 1);
  ctx.fillStyle = "#e02c2c";
  ctx.fillRect(x + 1, y + 3, 8, 7);
  ctx.fillStyle = "#b81e3c";
  ctx.fillRect(x + 2, y + 9, 6, 1);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(x + 2, y + 4, 2, 2);
}
function drawTwo(t, opts = {}) {
  const titles = opts.titles !== false;
  const GW = 384, GH = 216;
  inView(GW, GH, () => {
    const sky = ctx.createLinearGradient(0, 0, 0, GH);
    sky.addColorStop(0, "#4b3c9a");
    sky.addColorStop(0.6, "#8c78d8");
    sky.addColorStop(1, "#c4b2f2");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, GW, GH);
    for (let i = 0; i < 28; i++) {
      ctx.fillStyle = i % 3 ? "#8cf0ff" : "#f4ecd4";
      ctx.fillRect((i * 37 + t * 12) % GW, 6 + (i * 13) % 64, 1, 1);
    }
    const puff = (base, color, speed, r) => {
      ctx.fillStyle = color;
      for (let i = -1; i < 8; i++) {
        const x = ((i * 64 - t * speed) % (GW + 90) + GW + 90) % (GW + 90) - 30;
        ctx.beginPath();
        ctx.arc(x, base, r, 0, Math.PI * 2);
        ctx.arc(x + r * 0.8, base + 4, r * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillRect(0, base, GW, GH);
    };
    puff(108, "#7a64c8", 6, 18);
    puff(132, "#6551b4", 12, 14);
    puff(156, "#55439e", 20, 12);
    const brick = (x, y, w, h) => {
      ctx.fillStyle = "#4b3a7a";
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = "#3a2c63";
      for (let yy = y + 7; yy < y + h; yy += 8) ctx.fillRect(x, yy, w, 1);
      ctx.fillStyle = "#22163a";
      ctx.fillRect(x, y, w, 1);
      ctx.fillStyle = "#b6d846";
      ctx.fillRect(x, y + 1, w, 3);
      ctx.fillStyle = "#d6f07a";
      ctx.fillRect(x, y + 1, w, 1);
    };
    brick(0, 188, GW, 28);
    const scroll = t * 36;
    brick(24 - (scroll % 70), 150, 72, 16);
    brick(150 - (scroll % 90), 118, 68, 16);
    brick(250 - (scroll % 80), 146, 84, 16);
    drawPixelApple(168, 100);
    drawPixelApple(292, 128);
    const got = Math.min(3, 1 + Math.floor(t * 3.2));
    const swap = t > 0.42 && t < 0.72;
    const run = (t * 8) % 1 < 0.5;
    const heroX = 86;
    const air = Math.abs(Math.sin(t * 7)) * (swap ? 4 : 16);
    const ground = 188;
    if (media.two) {
      blitFeet(media.two, air > 8 ? "jump" : run ? "run" : "side", heroX, ground - air, 1, false, 1, 1);
      const rcx = swap ? heroX + 64 : heroX + 4;
      const rcy = swap ? ground - 46 - Math.abs(Math.sin(t * 10)) * 14 : ground - air - 28;
      blitFeet(media.two, swap ? "rcSide" : "rcFront", rcx, rcy, 1, false, 1, 1);
    }
    pixText(swap ? "RC" : "DROOBER", 6, 6, swap ? "#1cd2f0" : "#f39cc0", 1);
    for (let i = 0; i < 3; i++) {
      ctx.globalAlpha = i < got ? 1 : 0.35;
      drawPixelApple(GW - 42 + i * 12, 4);
      ctx.globalAlpha = 1;
    }
    pixText(got + "/3", GW - 40, 20, "#f4ecd4", 1);
    if (t > 0.78) {
      ctx.fillStyle = "rgba(34,22,58,0.55)";
      ctx.fillRect(0, 0, GW, GH);
      pixTextC("LEVEL CLEAR!", GW / 2, 78, "#f6c02c", 2, "#22163a");
      pixTextC(got + "/3 APPLES", GW / 2, 100, "#f4ecd4", 1, "#22163a");
    }
  });
  if (titles) titleBlock(t, "TWO PLACES AT ONCE", "Droober and RC.", { fill: "#f6c02c", ink: "#22163a", y: 650, size: 64, start: 0.7 });
}

function drawEndCard(t) {
  const local = clamp((t - 0.74) / 0.26, 0, 1);
  ctx.fillStyle = "#fff7ed";
  ctx.fillRect(0, 0, W, H);
  const blobs = [
    { x: 160, y: 140, c: "#aecf3e", s: 180 },
    { x: 1120, y: 180, c: "#ff74dd", s: 150 },
    { x: 1080, y: 600, c: "#00d1d8", s: 170 },
    { x: 180, y: 580, c: "#4a1d55", s: 90 },
  ];
  blobs.forEach((b, i) => {
    ctx.save();
    ctx.translate(b.x, b.y + Math.sin(t * 6 + i) * 10);
    ctx.rotate(Math.sin(t * 2 + i) * 0.2);
    ctx.fillStyle = b.c;
    roundRect(-b.s / 2, -b.s / 2, b.s, b.s, i % 2 ? b.s / 2 : 36);
    ctx.fill();
    ctx.restore();
  });
  const peek = buddies.slice(0, 4);
  peek.forEach((sprite, i) => {
    const x = 150 + i * 130;
    const bob = Math.sin(t * Math.PI * 4 + i) * 8;
    buddyAt(sprite, x, 392 + bob, 168, 1, 1, 0);
  });
  if (media.skip) {
    blitFeet(media.skip, "wave", 900, 360 + Math.sin(t * 8) * 6, 5.2, false, 1, 1);
    blitFeet(media.two, "rcSide", 1080, 392, 12, false, 1, 1);
  }
  const u = clamp(local / 0.45, 0, 1);
  const e = easeOutBack(u);
  const fade = t > 0.96 ? 1 - clamp((t - 0.96) / 0.04, 0, 1) : 1;
  ctx.save();
  ctx.translate(W / 2, 520);
  ctx.scale(lerp(1.5, 1, e), lerp(0.8, 1, e));
  ctx.globalAlpha = Math.min(1, u * 1.5) * fade;
  ctx.textAlign = "center";
  ctx.font = `700 28px "Space Grotesk"`;
  ctx.fillStyle = "#ff74dd";
  ctx.fillText("T ✦", 0, -168);
  ctx.font = `700 96px "Space Grotesk"`;
  ctx.fillStyle = "#aecf3e";
  ctx.fillText("TOKEN", 8, -40);
  ctx.fillText("ARCADE", 8, 64);
  ctx.fillStyle = "#1a0e20";
  ctx.fillText("TOKEN", 0, -50);
  ctx.fillText("ARCADE", 0, 54);
  ctx.font = `800 28px "DM Sans"`;
  const tag = "The Internet Is Fun.";
  const tw = ctx.measureText(tag).width + 36;
  roundRect(-tw / 2 + 6, 78, tw, 48, 24);
  ctx.fillStyle = "#1a0e20";
  ctx.fill();
  roundRect(-tw / 2, 72, tw, 48, 24);
  ctx.fillStyle = "#ff74dd";
  ctx.fill();
  ctx.fillStyle = "#1a0e20";
  ctx.fillText(tag, 0, 98);
  ctx.restore();
}

function drawArcade(t) {
  const cuts = [
    { id: "skrumpey-slide", label: "SKRUMPEY SLIDE", a: 0, b: 0.15, t0: 0.12, t1: 0.46 },
    { id: "coindle", label: "COINDLE", a: 0.15, b: 0.3, t0: 0.02, t1: 0.62 },
    { id: "uppers", label: "UPPERS", a: 0.3, b: 0.45, t0: 0.05, t1: 0.7 },
    { id: "skip-to-10k", label: "SKIP TO 10K", a: 0.45, b: 0.6, t0: 0, t1: 0.62 },
    { id: "two-places", label: "TWO PLACES", a: 0.6, b: 0.74, t0: 0, t1: 0.85 },
  ];
  if (t >= 0.74) {
    drawEndCard(t);
    return;
  }
  const cut = cuts.find((c) => t >= c.a && t < c.b) || cuts[0];
  const local = (t - cut.a) / (cut.b - cut.a);
  const sceneT = lerp(cut.t0, cut.t1, easeInOutCubic(local));
  ctx.save();
  const z = lerp(1.07, 1, easeOutCubic(Math.min(1, local / 0.35)));
  ctx.translate(W / 2, H / 2);
  ctx.scale(z, z);
  ctx.translate(-W / 2, -H / 2);
  scenes[cut.id](sceneT, { titles: false });
  ctx.restore();
  if (local < 0.1) {
    ctx.fillStyle = `rgba(255,247,237,${(1 - local / 0.1) * 0.72})`;
    ctx.fillRect(0, 0, W, H);
  }
  cutLabel(cut.label, local);
}

function drawDebug() {
  ctx.fillStyle = "#ff2bd6";
  ctx.fillRect(0, 0, W, H);
  buddies.forEach((sprite, i) => {
    buddyAt(sprite, 140 + (i % 6) * 200, 620, 420, 1, 1, 0);
    ctx.fillStyle = "#111";
    ctx.font = `700 28px "Space Grotesk"`;
    ctx.textAlign = "center";
    ctx.fillText(String(sprite.ratio), 140 + (i % 6) * 200, 80);
  });
}

const scenes = {
  "skrumpey-slide": drawSkrumpey,
  coindle: drawCoindle,
  uppers: drawUppers,
  "skip-to-10k": drawSkip,
  "two-places": drawTwo,
  arcade: drawArcade,
  debug: drawDebug,
};

window.render = (name, frame, total) => {
  const t = frame / total;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  (scenes[name] || drawArcade)(t, { titles: true });
};
window.posterFrame = (name, total) => Math.min(total - 1, Math.round((POSTER_AT[name] ?? 0.8) * total));

window.__ready = (async () => {
  await Promise.all([
    document.fonts.load('700 96px "Space Grotesk"'),
    document.fonts.load('500 28px "Space Grotesk"'),
    document.fonts.load('800 28px "DM Sans"'),
    document.fonts.load('600 24px "DM Sans"'),
  ]);
  await Promise.all([
    document.fonts.load('700 64px "Pixelify Sans"'),
    document.fonts.load('700 32px "Silkscreen"'),
  ]).catch(() => {});
  const [nuts, nutsRare, icon, btc, eth, sol, skip, two] = await Promise.all([
    loadImage(ASSETS.nuts), loadImage(ASSETS.nutsRare),
    loadImage(ASSETS.icon), loadImage(ASSETS.btc), loadImage(ASSETS.eth), loadImage(ASSETS.sol),
    loadImage(ASSETS.skip), loadImage(ASSETS.two),
  ]);
  Object.assign(media, { nuts, nutsRare, icon, btc, eth, sol, skip, two });
  const report = [];
  for (const item of ASSETS.buds) {
    const img = await loadImage(item.src);
    const keyed = chromaKey(img);
    report.push({ id: item.id, ratio: Number(keyed.ratio.toFixed(3)), ok: Boolean(keyed.ok) });
    if (keyed.ok && keyed.ratio <= 0.42) buddies.push(keyed);
  }
  rocks = [0, 3, 7, 12, 18].map((n) => makeBmp(ROCK_ROWS, rockPalette(n), 5));
  media.gem = makeBmp(GEM_ROWS, { o: "#3a1f6e", L: "#d6c2ff", D: "#8f6ae0" }, 4);
  media.crab = makeBmp(CRAB_ROWS, { o: "#b8321e", r: "#f0643c", w: "#fff" }, 4);
  window.__report = { buddies: buddies.length, keys: report };
  return window.__report;
})();
</script>
