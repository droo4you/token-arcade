}

function chromaKey(img) {

      if (seen[ni]) continue;

      if (dr * dr + dg * dg + db * db <= tol2) {

      ctx.lineTo(x, h);
    }
    ctx.lineTo(W, H);
    ctx.fillStyle = layer.color;
    ctx.fill();
  }
  ctx.fillStyle = "#79d26a";
  ctx.fillRect(0, 600, W, 120);
  ctx.fillStyle = "#62c45a";
  for (let x = -40; x < W + 40; x += 36) {
    const px = x - (pulsed(t, 460) % 36);
    ctx.fillRect(px, 612, 18, 8);
  }
  speedLines(t, 390, "rgba(255,255,255,0.45)", 0.55);
  sparkles(t, 18, "#fff4a8", 180, 560, 12);
  if (media.nuts) {
    for (let i = 0; i < 6; i++) {
      const nx = ((i * 230 - pulsed(t, 380)) % (W + 80) + W + 80) % (W + 80) - 40;
      const bob = -Math.pow(Math.abs(Math.sin(t * Math.PI * 2.6 + i * 0.7)), 0.65) * 26;
      ctx.save();
      ctx.translate(nx, 575 + bob);
      ctx.rotate(Math.sin(t * 6 + i) * 0.4);
      ctx.drawImage(media.nuts, -18, -18, 36, 36);
      ctx.restore();
    }
  }
  const pose = springHop(t, 2.6, 0.62);
  const ground = 530 - pose.air * 128;
  const leadX = 620 + Math.sin(t * Math.PI * 4) * 90;
  const env = t < 0.12 ? easeOutBack(t / 0.12) * 0.15 : t < 0.5 ? lerp(0.15, 1, easeOutBack(clamp((t - 0.12) / 0.38, 0, 1))) : t < 0.9 ? 1 : 1 - easeInCubic((t - 0.9) / 0.1);
  const train = buddies.slice(1, 4);
  train.forEach((sprite, index) => {
    const appear = clamp((env - index * 0.18) / 0.16, 0, 1);
    if (appear <= 0.02) return;
    const pop = appear < 1 ? easeOutBack(Math.min(1, appear)) : 1 + Math.sin(clamp((appear - 1) * 8, 0, Math.PI)) * 0.08;
    const lag = (index + 1) * 0.14;
    const follow = springHop(t - lag, 2.6, 0.62);
    const x = 620 + Math.sin((t - lag) * Math.PI * 4) * 90 - (index + 1) * 168;
    const gy = 548 - follow.air * (110 - index * 10) + Math.sin(t * Math.PI * 8 - index) * 10;
    const nextX = index === 0 ? leadX - 80 : 620 + Math.sin((t - index * 0.14) * Math.PI * 4) * 90 - index * 168 - 50;
    ctx.save();
    ctx.strokeStyle = "#241028";
    ctx.lineWidth = 10;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x + 30, gy - 90);
    ctx.quadraticCurveTo((x + nextX) / 2, gy + Math.sin(t * 16 + index) * 18, nextX, gy - 130);
    ctx.stroke();
    ctx.restore();
    const wob = follow.rot + Math.sin(t * Math.PI * 8 - index * 1.4) * 0.18;
    buddyAt(sprite, x, gy, (200 - index * 18) * Math.min(pop, 1.2), follow.sx, follow.sy * Math.max(0.4, Math.min(pop, 1.15)), wob);
    if (appear > 0.05 && appear < 0.92) {
      for (let k = 0; k < 7; k++) {
        const ang = k / 7 * Math.PI * 2 + t * 6;
        const rad = easeOutCubic(appear) * 70;
        drawStar(x + Math.cos(ang) * rad, gy - 100 + Math.sin(ang) * rad * 0.55, 6 + (k % 3) * 3, k % 2 ? "#fff36b" : "#ff74dd", 1 - appear, ang);
      }
    }
  });
  if (buddies[0]) {
    const vx = Math.cos(t * Math.PI * 4);
    ctx.save();
    ctx.globalAlpha = 0.28;
    buddyAt(buddies[0], leadX - vx * 46, ground + 10, 250, pose.sx, pose.sy, pose.rot);
    ctx.restore();
    buddyAt(buddies[0], leadX, ground, 280, pose.sx, pose.sy, pose.rot);
    if (pose.hop > 0.86) {

      ctx.beginPath();
      ctx.ellipse(leadX, 560, 20 + (pose.hop - 0.86) * 180, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
  vignette(0.18);
  if (titles) titleBlock(t, "SKRUMPEY SLIDE", "Rescue them. Grow the train.", { fill: "#fff36b", y: 640, size: 86 });
}

function drawCatCell(x, y, w, h, label, value, color, flip, arrow) {
  const s = Math.cos(clamp(flip, 0, 1) * Math.PI);

  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  ctx.scale(Math.max(0.05, Math.abs(s)), 1);
  roundRect(-w / 2, -h / 2, w, h, 12);
  if (!front) {
    ctx.fillStyle = "#2A2F38";
    ctx.fill();
    ctx.setLineDash([6, 5]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#3A3F4A";
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#6B6774";
    ctx.font = `600 15px "DM Sans"`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label.toUpperCase(), 0, 0);
  } else {
    ctx.fillStyle = color;
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `800 ${value.length > 10 ? 16 : 20}px "DM Sans"`;
    ctx.fillText(value, 0, arrow ? -12 : 0);
    if (arrow) {
      ctx.beginPath();
      if (arrow === "up") { ctx.moveTo(0, 4); ctx.lineTo(-9, 18); ctx.lineTo(9, 18); }
      else { ctx.moveTo(0, 22); ctx.lineTo(-9, 8); ctx.lineTo(9, 8); }
      ctx.fill();
    }
  }
  ctx.restore();
}

function placePose(t) {

  const crouch = t >= 0.46 && t < 0.6;
  const celebrate = t >= 0.8;
  let air = 0, sx = 1, sy = 1, name = "run";
  if (jump1 || jump2) {
    const a = jump1 ? 0.14 : 0.62, b = jump1 ? 0.34 : 0.78;
    const u = (t - a) / (b - a);
    air = Math.pow(Math.sin(u * Math.PI), 0.7);
    name = "jump";
    sx = 0.84; sy = 1.22;
    if (u < 0.12) { sx = 1.35; sy = 0.7; }
    if (u > 0.86) { sx = 1.4; sy = 0.62; }
  } else if (crouch) {
    name = "crouch";
    sx = 1.2; sy = 0.78;
  } else if (celebrate) {
    name = "wave";
    sy = 1 + Math.sin(t * 18) * 0.06;
  } else {
    const step = (t * 8) % 1;
    sx = step < 0.5 ? 1.08 : 0.94;
    sy = step < 0.5 ? 0.94 : 1.08;
  }
  return { air, sx, sy, name, crouch, celebrate };
}
function drawBrickRun(x, y, w, h, theme) {
  const grass = theme === "shroom" ? "#5ec44a" : "#b6d846";
  const soil = theme === "shroom" ? "#8a5a3c" : "#4b3a7a";
  const soilD = theme === "shroom" ? "#6e4630" : "#3a2c63";
  ctx.fillStyle = soil;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = "#22163a";
  ctx.fillRect(x, y, w, 4);
  ctx.fillStyle = grass;
  ctx.fillRect(x, y + 4, w, 10);
  ctx.fillStyle = theme === "shroom" ? "#9be36a" : "#d6f07a";
  ctx.fillRect(x, y + 4, w, 3);
  for (let i = 0; i < w; i += 28) ctx.fillStyle = soilD, ctx.fillRect(x + i, y + 22, 2, h);
}
function drawApplePix(x, y, got, pop) {
  if (got && pop <= 0) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(3, 3);
  ctx.fillStyle = "#22163a";
  ctx.fillRect(4, 0, 2, 3);
  ctx.fillStyle = "#5fbf4a";
  ctx.fillRect(6, 0, 3, 2);
  ctx.fillStyle = "#e02c2c";
  ctx.fillRect(1, 3, 8, 7);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(2, 4, 2, 2);
  ctx.restore();
  if (pop > 0) drawStar(x, y - 20, 10 + pop * 16, "#f6c02c", 1 - pop, pop * 4);
}
function drawHalf(ox, t, theme) {
  const scroll = keyed(t, [[0, 0], [0.14, 60], [0.32, 240], [0.46, 380], [0.6, 620], [0.78, 900], [1, 1040]]);
  const pose = placePose(t);
  const ground = 520;
  const heroX = ox + 250;
  const worldX = scroll + 250;
  ctx.save();
  ctx.beginPath();
  ctx.rect(ox, 0, W / 2, H);
  ctx.clip();
  const bump = (at) => {
    const d = Math.abs(t - at);
    return d < 0.07 ? 1 + 0.07 * Math.sin((1 - d / 0.07) * Math.PI) : 1;
  };
  const z = bump(0.33) * bump(0.77);
  ctx.translate(ox + 320, 400);
  ctx.scale(z, z);
  ctx.translate(-(ox + 320), -400);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  if (theme === "shroom") { sky.addColorStop(0, "#6ec8ff"); sky.addColorStop(1, "#d8f6ff"); }
  else { sky.addColorStop(0, "#4b3c9a"); sky.addColorStop(0.7, "#8c78d8"); sky.addColorStop(1, "#c4b2f2"); }
  ctx.fillStyle = sky;
  ctx.fillRect(ox, 0, W / 2, H);
  ctx.fillStyle = theme === "shroom" ? "rgba(255,255,255,0.8)" : "rgba(253,251,240,0.45)";
  for (let i = 0; i < 4; i++) {
    const cx = ox + ((i * 180 - scroll * 0.15) % 700 + 700) % 700;
    ctx.beginPath();
    ctx.arc(cx, 70 + i * 16, 22, 0, Math.PI * 2);
    ctx.arc(cx + 24, 78 + i * 16, 16, 0, Math.PI * 2);
    ctx.fill();
  }
  if (theme === "shroom") {
    for (let i = 0; i < 5; i++) {
      const mx = ox + ((i * 150 - scroll * 0.25) % 760 + 760) % 760;
      ctx.fillStyle = i % 2 ? "#e5484d" : "#4a7fe0";
      ctx.beginPath();
      ctx.ellipse(mx, 250, 34, 22, 0, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = "#f4ecd4";
      ctx.fillRect(mx - 6, 250, 12, 40);
    }
  }
  const plat = (wx, wy, ww) => drawBrickRun(ox + wx - scroll, wy, ww, 70, theme);
  plat(-40, ground, 1500);
  plat(520, 390, 180);
  const bob = Math.sin(t * Math.PI * 4) * 16;
  plat(760, 430 + bob, 150);
  for (let i = 0; i < 3; i++) {
    const sx = ox + 360 + i * 28 - scroll;
    ctx.fillStyle = "#22163a";
    ctx.beginPath();
    ctx.moveTo(sx, ground);
    ctx.lineTo(sx + 14, ground);
    ctx.lineTo(sx + 7, ground - 28);
    ctx.fill();
    ctx.fillStyle = "#f4ecd4";
    ctx.fillRect(sx + 6, ground - 22, 2, 8);
  }
  const apples = [300, 600, 980];
  let got = 0;
  apples.forEach((ax) => {
    const collected = worldX > ax + 8;
    if (collected) got++;
    const since = collected ? clamp((worldX - ax) / 80, 0, 1) : 0;
    drawApplePix(ox + ax - scroll, ground - 78, collected, collected ? 1 - since : 0);
  });
  const zapX = ox + 800 - scroll;
  const zapOn = t > 0.44 && t < 0.62;
  if (zapX > ox - 40 && zapX < ox + W / 2) {
    ctx.globalAlpha = zapOn ? 0.95 : 0.25;
    ctx.fillStyle = "#1cd2f0";
    ctx.fillRect(zapX, 392, 160, 10);
    ctx.globalAlpha = 1;
    if (pose.crouch && zapOn) {
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(heroX, 500, 36, Math.PI, 0);
      ctx.stroke();
    }
  }
  const doorX = ox + 1120 - scroll;
  const open = clamp((t - 0.76) / 0.1, 0, 1);
  ctx.fillStyle = "#22163a";
  ctx.fillRect(doorX, ground - 120, 48, 120);
  ctx.fillStyle = "#f6c02c";
  ctx.fillRect(doorX + 4, ground - 116 + open * 90, 40, 112 - open * 90);
  const feet = ground - pose.air * 150 + (pose.crouch ? 18 : 0);
  const sprite = pose.name === "jump" ? "jump" : pose.name === "crouch" ? "crouch" : pose.name === "wave" ? "wave" : "run";
  const rcName = pose.name === "jump" ? "rcSide" : "rcFront";
  footShadow(heroX, ground + 6, 36);
  blitFeet(media.two, sprite, heroX, feet, 4.4, sprite === "jump", pose.sx, pose.sy);
  blitFeet(media.skip, rcName, heroX + 78, feet + 24 - pose.air * 40, 9, false, pose.sx, pose.sy);
  pixText(got + "/3", ox + 24, 24, "#22163a", 3);
  if (pose.celebrate) {
    for (let k = 0; k < 8; k++) drawStar(heroX + Math.cos(k + t * 6) * 50, feet - 80 + Math.sin(k) * 30, 8, "#f6c02c", 0.9, k);
  }
  ctx.restore();
}
function drawTwo(t, opts = {}) {
  const titles = opts.titles !== false;
  const swapped = t >= 0.48;
  drawHalf(0, t, swapped ? "shroom" : "grass");
  drawHalf(W / 2, t, swapped ? "grass" : "shroom");
  const wipe = t > 0.4 && t < 0.56 ? clamp((t - 0.4) / 0.08, 0, 1) * (t < 0.48 ? 1 : 1 - clamp((t - 0.48) / 0.08, 0, 1)) : 0;
  if (wipe > 0) {
    ctx.fillStyle = `rgba(253,251,240,${wipe})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.fillStyle = "#22163a";
  ctx.fillRect(W / 2 - 4, 0, 8, H);
  if (titles) titleBlock(t, "TWO PLACES AT ONCE", "One move. Both worlds.", { fill: "#f6c02c", y: 640, size: 64, start: 0.8 });
}

function drawEndCard(t) {
  const local = clamp((t - 0.74) / 0.26, 0, 1);
  ctx.fillStyle = "#fff7ed";
  ctx.fillRect(0, 0, W, H);
  const blobs = [
    { x: 160, y: 140, c: "#aecf3e", s: 180 },
    { x: 1120, y: 180, c: "#ff74dd", s: 150 },
    { x: 1080, y: 600, c: "#00d1d8", s: 170 },
    { x: 180, y: 580, c: "#4a1d55", s: 90 },
  ];
  blobs.forEach((b, i) => {
    ctx.save();
    ctx.translate(b.x, b.y + Math.sin(t * 6 + i) * 10);
    ctx.rotate(Math.sin(t * 2 + i) * 0.2);
    ctx.fillStyle = b.c;
    roundRect(-b.s / 2, -b.s / 2, b.s, b.s, i % 2 ? b.s / 2 : 36);
    ctx.fill();
    ctx.restore();
  });
  const peek = buddies.slice(0, 4);
  peek.forEach((sprite, i) => {
    const x = 150 + i * 130;
    const bob = Math.sin(t * Math.PI * 4 + i) * 8;
    buddyAt(sprite, x, 392 + bob, 168, 1, 1, 0);
  });
  if (media.skip) {
    blitFeet(media.skip, "wave", 900, 360 + Math.sin(t * 8) * 6, 5.2, false, 1, 1);
    blitFeet(media.two, "rcSide", 1080, 392, 12, false, 1, 1);
  }
  const u = clamp(local / 0.45, 0, 1);
  const e = easeOutBack(u);
  const fade = t > 0.96 ? 1 - clamp((t - 0.96) / 0.04, 0, 1) : 1;
  ctx.save();
  ctx.translate(W / 2, 520);
  ctx.scale(lerp(1.5, 1, e), lerp(0.8, 1, e));
  ctx.globalAlpha = Math.min(1, u * 1.5) * fade;
  ctx.textAlign = "center";
  ctx.font = `700 28px "Space Grotesk"`;
  ctx.fillStyle = "#ff74dd";
  ctx.fillText("T ✦", 0, -168);
  ctx.font = `700 96px "Space Grotesk"`;
  ctx.fillStyle = "#aecf3e";
  ctx.fillText("TOKEN", 8, -40);
  ctx.fillText("ARCADE", 8, 64);
  ctx.fillStyle = "#1a0e20";
  ctx.fillText("TOKEN", 0, -50);
  ctx.fillText("ARCADE", 0, 54);
  ctx.font = `800 28px "DM Sans"`;
  const tag = "The Internet Is Fun.";
  const tw = ctx.measureText(tag).width + 36;
  roundRect(-tw / 2 + 6, 78, tw, 48, 24);
  ctx.fillStyle = "#1a0e20";
  ctx.fill();
  roundRect(-tw / 2, 72, tw, 48, 24);
  ctx.fillStyle = "#ff74dd";
  ctx.fill();
  ctx.fillStyle = "#1a0e20";
  ctx.fillText(tag, 0, 98);
  ctx.restore();
}

function drawArcade(t) {
  const cuts = [
    { id: "skrumpey-slide", label: "SKRUMPEY SLIDE", a: 0, b: 0.15, t0: 0.12, t1: 0.46 },
    { id: "coindle", label: "COINDLE", a: 0.15, b: 0.3, t0: 0.02, t1: 0.62 },
    { id: "uppers", label: "UPPERS", a: 0.3, b: 0.45, t0: 0.05, t1: 0.7 },
    { id: "skip-to-10k", label: "SKIP TO 10K", a: 0.45, b: 0.6, t0: 0, t1: 0.62 },
    { id: "two-places", label: "TWO PLACES", a: 0.6, b: 0.74, t0: 0, t1: 0.85 },
  ];
  if (t >= 0.74) {
    drawEndCard(t);
    return;
  }
  const cut = cuts.find((c) => t >= c.a && t < c.b) || cuts[0];
  const local = (t - cut.a) / (cut.b - cut.a);
  const sceneT = lerp(cut.t0, cut.t1, easeInOutCubic(local));
  ctx.save();
  const z = lerp(1.07, 1, easeOutCubic(Math.min(1, local / 0.35)));
  ctx.translate(W / 2, H / 2);
  ctx.scale(z, z);
  ctx.translate(-W / 2, -H / 2);
  scenes[cut.id](sceneT, { titles: false });
  ctx.restore();
  if (local < 0.1) {
    ctx.fillStyle = `rgba(255,247,237,${(1 - local / 0.1) * 0.72})`;
    ctx.fillRect(0, 0, W, H);
  }
  cutLabel(cut.label, local);
}

function drawDebug() {
  ctx.fillStyle = "#ff2bd6";
  ctx.fillRect(0, 0, W, H);
  buddies.forEach((sprite, i) => {
    buddyAt(sprite, 140 + (i % 6) * 200, 620, 420, 1, 1, 0);
    ctx.fillStyle = "#111";
    ctx.font = `700 28px "Space Grotesk"`;
    ctx.textAlign = "center";
    ctx.fillText(String(sprite.ratio), 140 + (i % 6) * 200, 80);
  });
}

const scenes = {
  "skrumpey-slide": drawSkrumpey,
  coindle: drawCoindle,
  uppers: drawUppers,
  "skip-to-10k": drawSkip,
  "two-places": drawTwo,
  arcade: drawArcade,
  debug: drawDebug,
};

window.render = (name, frame, total) => {
  const t = frame / total;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  (scenes[name] || drawArcade)(t, { titles: true });
};
window.posterFrame = (name, total) => Math.min(total - 1, Math.round((POSTER_AT[name] ?? 0.8) * total));

window.__ready = (async () => {
  await Promise.all([
    document.fonts.load('700 96px "Space Grotesk"'),
    document.fonts.load('500 28px "Space Grotesk"'),
    document.fonts.load('800 28px "DM Sans"'),
    document.fonts.load('600 24px "DM Sans"'),
  ]);
  const [nuts, housing, cap, lip, icon, btc, eth, sol, skip, two] = await Promise.all([
    loadImage(ASSETS.nuts), loadImage(ASSETS.housing), loadImage(ASSETS.cap), loadImage(ASSETS.lip),
    loadImage(ASSETS.icon), loadImage(ASSETS.btc), loadImage(ASSETS.eth), loadImage(ASSETS.sol),
    loadImage(ASSETS.skip), loadImage(ASSETS.two),
  ]);
  Object.assign(media, { nuts, housing, cap, lip, icon, btc, eth, sol, skip, two });
  const report = [];
  for (const item of ASSETS.buds) {
    const img = await loadImage(item.src);
    const keyed = chromaKey(img);
    report.push({ id: item.id, ratio: Number(keyed.ratio.toFixed(3)), ok: Boolean(keyed.ok) });
    if (keyed.ok) buddies.push(keyed);
  }
  rocks = [0, 3, 7, 12, 18].map((n) => makeBmp(ROCK_ROWS, rockPalette(n), 5));
  media.gem = makeBmp(GEM_ROWS, { o: "#3a1f6e", L: "#d6c2ff", D: "#8f6ae0" }, 4);
  media.crab = makeBmp(CRAB_ROWS, { o: "#b8321e", r: "#f0643c", w: "#fff" }, 4);
  window.__report = { buddies: buddies.length, keys: report };
  return window.__report;
})();
