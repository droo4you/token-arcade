# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Token Arcade economy indexer (Monad testnet 10143).
# Defaults below are the Monad testnet deployment in contracts/deployments/monad-testnet.json
# (economy v0.2.2, deployed 2026-10-13, first block 70821881). NFT raid vault is not deployed yet.
# Addresses come from env (see .env.example / `npm run addresses`, which reads
# ../contracts/deployments/monad-testnet.json). Placeholders (0x…01..05) index nothing.
name: token-arcade-indexer
description: Token Arcade MiniCoin economy + raid vaults on Monad
field_selection:
  transaction_fields:
    - hash
    - from
contracts:
  - name: EconomyRaidVault
    abi_file_path: ./abis/EconomyRaidVault.json
    events:
      - event: ConfigUpdated
      - event: RaidOpened
      - event: RaidSettled
      - event: PrizeClaimed
      - event: RaidCancelled
      - event: RaidTimedOut
      - event: PrizeExpired
  - name: CommunityNftRaidVault
    abi_file_path: ./abis/CommunityNftRaidVault.json
    events:
      - event: TemplateSet
      - event: RaidOpened
      - event: Awarded
      - event: Claimed
      - event: RefundAvailable
      - event: Refunded
  - name: EconomyManager
    abi_file_path: ./abis/EconomyManager.json
    events:
      - event: PoolConfigured
      - event: Distributed
  - name: FeeAccumulator
    abi_file_path: ./abis/FeeAccumulator.json
    events:
      - event: HookSet
      - event: Redeemed
  - name: MiniCoinHook
    abi_file_path: ./abis/MiniCoinHook.json
    events:
      - event: FeeCaptured
      - event: FeeCollected
chains:
  - id: 10143
    start_block: ${ENVIO_START_BLOCK:-0}
    contracts:
      - name: EconomyRaidVault
        address: "${ENVIO_RAID_VAULT:-0x2e9497F8f8fc1cb4b51ACd35E5E27A21b389af7D}"
      - name: CommunityNftRaidVault
        address: "${ENVIO_NFT_RAID_VAULT:-0x0000000000000000000000000000000000000002}"
      - name: EconomyManager
        address: "${ENVIO_ECONOMY_MANAGER:-0x03254f5046482695614E56269c4849D185fCA727}"
      - name: FeeAccumulator
        address: "${ENVIO_FEE_ACCUMULATOR:-0x329D2f485625b19CB6b9299011Db4457A4fea276}"
      - name: MiniCoinHook
        address: "${ENVIO_MINICOIN_HOOK:-0xCdE995A2445EBAA8Ded2d00D4D59DdCC35b060cc}"
